        .pulse-red { animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }

        const RANKS = [
            "Cadet", "EMT", "Paramedic", "Senior Paramedic", 
            "Doctor", "Deputy Medical Officer", "Assistant Chief", "Chief"
        ];
        
        const EXAM_LENGTH = 10;
        const MIN_PASS_SCORE = 7;
        const EXAM_TIME_SECONDS = 15 * 60; // 15 minutes

        const i18n = {

                fullName: "الاسم الكامل (IC)", currentRank: "الرتبة الحالية", requestedRank: "الرتبة المطلوبة",
                begin: "ابدأ الاختبار", invalid_promotion: "مسار ترقية غير صالح. يجب التقديم على الرتبة التالية مباشرة.",
                enter_name: "يرجى إدخال اسمك الكامل.",

                time_remaining: "الوقت المتبقي", time_up: "انتهى الوقت! يتم تسليم الاختبار تلقائياً...",
                answer_all: "يرجى الإجابة على جميع الأسئلة قبل التسليم.",
                results: "نتيجة امتحان الترقية", candidate: "المرشح", score: "النتيجة",
                status: "الحالة", passed: "ناجح", failed: "راسب",
                pass_msg: "تهانينا. لقد اجتزت امتحان الترقية بنجاح.",
                fail_msg: "لم تحقق الحد الأدنى للنجاح. يمكنك إعادة الاختبار وفقاً لقواعد قسم الإسعاف.",
                min_required: "الحد الأدنى المطلوب", return_home: "العودة للرئيسية", exam_id: "معرف الاختبار", date: "التاريخ",
                admin_dashboard: "لوحة تحكم الإدارة", history: "سجل الاختبارات", search: "البحث عن مرشح...",
                no_data: "لا توجد سجلات امتحانات.", actions: "إجراءات", close: "إغلاق",

                correct: "صحيح", incorrect: "خاطئ", question_bank_mgr: "مدير بنك الأسئلة",
                add_question: "إضافة سؤال جديد", rank: "الرتبة", category: "التصنيف", difficulty: "الصعوبة",

            },
            fr: {
                title: "SYSTÈME DE PROMOTION EMS", subtitle: "43 FAMILY ROLEPLAY - SAISON 2",
                home: "Accueil", admin: "Administration", candidate_portal: "Portail Candidat",
                fullName: "Nom Complet (IC)", currentRank: "Grade Actuel", requestedRank: "Grade Demandé",
                begin: "Commencer l'examen", invalid_promotion: "Chemin de promotion invalide.",
                enter_name: "Veuillez entrer votre nom complet.",
                exam_in_progress: "Examen en cours", question: "Question", of: "sur",
                prev: "Précédent", next: "Suivant", submit: "Soumettre",
                time_remaining: "Temps Restant", time_up: "Temps écoulé! Soumission automatique...",
                answer_all: "Veuillez répondre à toutes les questions.",
                results: "RÉSULTAT DE L'EXAMEN", candidate: "Candidat", score: "Score",
                status: "Résultat", passed: "RÉUSSI", failed: "ÉCHOUÉ",
                pass_msg: "Félicitations. Vous avez réussi l'examen de promotion.",
                fail_msg: "Vous n'avez pas atteint le score minimum. Vous pouvez repasser l'examen selon les règles.",
                min_required: "Minimum requis", return_home: "Retour à l'accueil", exam_id: "ID Examen", date: "Date",
                admin_dashboard: "Tableau de bord Admin", history: "Historique", search: "Rechercher...",
                no_data: "Aucun enregistrement trouvé.", actions: "Actions", close: "Fermer",
                q_text: "Question", candidate_answer: "Réponse du candidat", correct_answer: "Bonne réponse",
                not_answered: "Non répondu", exam_details: "Feuille de réponses détaillée",
                correct: "Correct", incorrect: "Incorrect", question_bank_mgr: "Gestionnaire de la banque de questions",
                add_question: "Ajouter une question", rank: "Grade", category: "Catégorie", difficulty: "Difficulté",
                save: "Enregistrer", cancel: "Annuler", active: "Actif", disabled: "Désactivé", edit: "Modifier", delete: "Supprimer",
                admin_pass_title: "Vérification Admin", admin_pass_prompt: "Entrez le mot de passe admin:",
                admin_pass_btn: "Accéder", admin_pass_err: "Mot de passe incorrect!"
            }
        };

        const generateDatabase = () => {
            const db = [];
            let qIdCounter = 1;
            const categories = ["EMS Rules", "Medical Procedures", "Emergency Response", "Patient Assessment", "Roleplay Situations", "Communication", "Decision Making", "Equipment", "Professional Conduct"];

            RANKS.forEach((rank) => {
                for (let i = 1; i <= 20; i++) {
                    const diffLevel = i <= 12 ? "Easy" : i <= 18 ? "Medium" : "Hard";
                    const cat = categories[(i - 1) % categories.length];

                    let qEn, qAr, qFr, optEn, optAr, optFr, correct;

                    // Rank-specific tailor-made questions for FiveM Server RP
                    if (rank === "Cadet") {
                        if (i === 1) {
                            qEn = "You arrive at a street accident and find an unconscious civilian. What is your very first required action according to EMS protocol?";
                            qAr = "وصلت إلى حادث في الشارع ووجدت مدنياً فاقداً للوعي. ما هو أول إجراء مطلوب منك وفقاً لبروتوكول الإسعاف؟";
                            qFr = "Vous arrivez sur un accident de rue et trouvez un civil inconscient. Quelle est votre toute première action requise ?";
                            optEn = ["Immediately revive without checking", "Inspect the patient using the EMS interaction and check scene safety", "Leave the patient", "Ask bystanders to treat them"];
                            optAr = ["الإنعاش الفوري بدون فحص", "فحص المريض باستخدام تفاعل الإسعاف والتحقق من سلامة الموقع", "ترك المريض", "طلب من المارة علاجهم"];
                            optFr = ["Réanimer immédiatement", "Inspecter le patient via l'interaction EMS et vérifier la sécurité", "Laisser le patient", "Demander aux passants de le traiter"];
                            correct = 1;
                        } else if (i === 2) {
                            qEn = "Can a Cadet ignore the official uniform and dress code rules while on duty at Pillbox Hospital?";
                            qAr = "هل يمكن لمتدرب الإسعاف تجاهل قواعد الزي الرسمي أثناء الخدمة في مستشفى بيلبوكس؟";
                            optFr = ["Un cadet peut-il ignorer l'uniforme officiel en service à l'hôpital ?", "نعم، الزي لا يهم", "لا، الزي الرسمي الاحترافي إلزامي", "فقط عند الطوارئ", "لا أعرف"];
                            optEn = ["Yes, uniforms do not matter in RP", "No, professional uniform and proper appearance are mandatory at all times on duty", "Only during high-priority calls", "Only if approved by another cadet"];
                            optAr = ["نعم، الزي الرسمي لا يهم في الرول بلاي", "لا، الزي الرسمي الاحترافي والمظهر اللائق إلزامي في جميع الأوقات أثناء الخدمة", "فقط عند المكالمات العالية الأولوية", "فقط إذا وافق متدرب آخر"];
                            correct = 1;
                        } else {
                            qEn = `[Cadet Basic RP #${i}] You receive a dispatch call about an injured civilian. Upon arrival, what is your standard expected behavior?`;
                            qAr = `[لعب الأدوار الأساسي للمتدرب #${i}] تلقيت بلاغاً عن مدني مصاب. عند الوصول، ما هو السلوك القياسي المتوقع منك؟`;
                            optFr = `[RP de base Cadet #${i}] Vous recevez un appel concernant un civil blessé. À l'arrivée, quel est votre comportement attendu ?`;
                            optEn = ["Ignore the player and wait", "Interact professionally, inspect condition, provide treatment RP, and communicate status", "Drive away quickly", "Argue with civilians"];
                            optAr = ["تجاهل اللاعب والانتظار", "التفاعل بمهنية، فحص الحالة، تقديم رول بلاي العلاج، وتوصيل الحالة", "الابتعاد بسرعة", "الجدال مع المدنيين"];
                            correct = 1;
                        }
                    } else if (rank === "EMT") {
                        if (i === 1) {
                            qEn = "You inspect an injured player using the EMS system and see their chest area is injured. What treatment step is required?";
                            qAr = "أنت تفحص لاعباً مصاباً باستخدام نظام الإسعاف وترى أن منطقة الصدر مصابة. ما هي خطوة العلاج المطلوبة؟";
                            optFr = ["Vous inspectez un joueur blessé et voyez sa poitrine blessée. Quelle étape est requise ?"];
                            optEn = ["Apply chest bandage and proper stabilization RP before reviving", "Give them water", "Do nothing and revive instantly", "Put them in a trunk"];
                            optAr = ["تطبيق ضماد الصدر ولعب دور التثبيت المناسب قبل الإنعاش", "إعطاؤهم الماء", "عدم فعل أي شيء والإنعاش فوراً", "وضعهم في صندوق السيارة"];
                            correct = 0;
                        } else {
                            qEn = `[EMT Operations #${i}] If a police officer asks you to stage at a safe distance away from an active shootout scene, what must you do?`;
                            qAr = `[عمليات مسعف الطوارئ #${i}] إذا طلبت منك الشرطة التمركز على مسافة آمنة بعيداً عن موقع إطلاق نار نشط، فماذا يجب عليك أن تفعل؟`;
                            optFr = `[Opérations EMT #${i}] Si un officier vous demande de rester à distance d'une fusillade active, que devez-vous faire ?`;
                            optEn = ["Drive directly into the gunfire", "Comply and stage at a safe designated location until police declare the scene secure", "Refuse and yell at officers", "Leave the city"];
                            optAr = ["القيادة مباشرة نحو إطلاق النار", "الامتثال والتمركز في مكان آمن محدد حتى تعلن الشرطة أن المكان آمن", "الرفض والصراخ على الضباط", "مغادرة المدينة"];
                            correct = 1;
                        }
                    } else {
                        // General robust generation for other ranks to guarantee 160 fully populated questions
                        qEn = `[${rank} Standard Exam #${i}] You are responding to a priority call requiring standard EMS protocol. What is the correct procedure?`;
                        qAr = `[اختبار ${rank} القياسي #${i}] أنت تستجيب لمكالمة ذات أولوية تتطلب بروتوكول الإسعاف القياسي. ما هو الإجراء الصحيح؟`;
                        optFr = `[Examen ${rank} #${i}] Vous répondez à un appel prioritaire. Quelle est la bonne procédure ?`;
                        optEn = ["Follow established server protocols, assess the scene, and treat professionally", "Ignore instructions and revive instantly", "Leave the patient", "Argue with dispatch"];
                        optAr = ["اتباع البروتوكولات المعمول بها، تقييم الموقع، والعلاج بمهنية", "تجاهل التعليمات والإنعاش الفوري", "ترك المريض", "الجدال مع غرفة الإرسال"];
                        correct = 0;
                    }

                    db.push({
                        id: `${rank.substring(0,3).toUpperCase()}-${String(qIdCounter++).padStart(3, '0')}`,
                        rank, category: cat, difficulty: diffLevel,
                        text: { en: qEn, ar: qAr, fr: qFr || qEn },
                        options: { en: optEn, ar: optAr, fr: optFr || optEn },
                        correctAnswer: correct,
                        active: true,
                        usageCount: 0
                    });
                }
            });
            return db;
        };

        const initialQuestionsDB = generateDatabase();

        const ExamView = ({ candidate, examSession, submitExam, t, language }) => {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(EXAM_TIME_SECONDS);
            
            const q = examSession.questions[currentIdx];
            const isLast = currentIdx === EXAM_LENGTH - 1;

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { 
                            clearInterval(timer); 
                            submitExam(answers); 
                            return 0; 
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [answers, submitExam]);

            const handleNext = () => setCurrentIdx(p => p + 1);
            const handlePrev = () => setCurrentIdx(p => p - 1);
            const handleSubmit = () => {
                if (Object.keys(answers).length < EXAM_LENGTH) return alert(t.answer_all);
                submitExam(answers);
            };

            const mins = Math.floor(timeLeft / 60);
            const secs = String(timeLeft % 60).padStart(2, '0');

            const qText = q.text[language] || q.text['en'];
            const optsArray = q.options[language] || q.options['en'];
            const qOpts = q.shuffledIndices.map(idx => optsArray[idx]);

            return (
                <div className="max-w-4xl mx-auto fade-in">
                    <div className="glass-panel p-5 rounded-2xl mb-6 flex justify-between items-center border-b-4 border-b-ems-red">
                        <div>
                            <div className="text-gray-400 text-sm mb-1">{t.candidate}: <span className="text-white font-bold">{candidate.fullName}</span></div>
                            <div className="text-xl font-bold">{candidate.requestedRank} Examination</div>
                        </div>
                        <div className={`text-2xl font-mono font-bold flex items-center gap-3 px-4 py-2 rounded-lg ${timeLeft < 180 ? 'bg-red-900/50 text-red-400 animate-pulse' : 'bg-gray-800 text-white'}`}>
                            <i className="fas fa-stopwatch"></i> {mins}:{secs}
                        </div>
                    </div>

                    <div className="glass-panel p-8 rounded-2xl shadow-2xl min-h-[400px] flex flex-col relative">
                        <div className="absolute top-0 left-0 w-full h-1.5 bg-gray-800 rounded-t-2xl overflow-hidden">
                            <div className="h-full bg-ems-red transition-all duration-300" style={{width: `${((currentIdx + 1) / EXAM_LENGTH) * 100}%`}}></div>
                        </div>

                        <div className="flex justify-between items-center mb-8 pt-2">
                            <span className="text-sm font-bold text-gray-400 uppercase tracking-widest">{q.category}</span>
                            <span className="text-sm bg-gray-800 px-3 py-1 rounded text-gray-300">{t.question} {currentIdx + 1} {t.of} {EXAM_LENGTH}</span>
                        </div>

                        <h3 className="text-2xl font-semibold leading-relaxed mb-8 text-white">{qText}</h3>

                        <div className="space-y-4 flex-grow">
                            {qOpts.map((opt, i) => {
                                const isSelected = answers[currentIdx] === i;
                                return (
                                    <div key={i} onClick={() => setAnswers({...answers, [currentIdx]: i})}
                                        className={`p-5 rounded-xl border-2 cursor-pointer transition-all flex items-start gap-4 ${isSelected ? 'border-ems-red bg-red-900/20 shadow-[0_0_15px_rgba(220,38,38,0.15)]' : 'border-gray-700 bg-gray-800/50 hover:border-gray-500'}`}>
                                        <div className={`mt-1 w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${isSelected ? 'border-ems-red' : 'border-gray-500'}`}>
                                            {isSelected && <div className="w-3 h-3 bg-ems-red rounded-full"></div>}
                                        </div>
                                        <span className="text-lg text-gray-200">{opt}</span>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mt-10 pt-6 border-t border-gray-800 flex justify-between items-center">
                            <button onClick={handlePrev} disabled={currentIdx === 0} className={`px-6 py-3 rounded-lg font-bold flex items-center gap-2 transition ${currentIdx === 0 ? 'opacity-30 cursor-not-allowed text-gray-500' : 'bg-gray-800 hover:bg-gray-700 text-white'}`}>
                                <i className="fas fa-arrow-left rtl:rotate-180"></i> {t.prev}
                            </button>
                            
                            <div className="flex gap-2">
                                {Array.from({length: EXAM_LENGTH}).map((_, i) => (
                                    <div key={i} className={`w-3 h-3 rounded-full ${i === currentIdx ? 'bg-ems-red scale-125' : answers[i] !== undefined ? 'bg-gray-400' : 'bg-gray-800'}`}></div>
                                ))}
                            </div>

                            {isLast ? (
                                <button onClick={handleSubmit} className="px-8 py-3 rounded-lg font-bold bg-green-600 hover:bg-green-500 text-white shadow-lg flex items-center gap-2">
                                    {t.submit} <i className="fas fa-check"></i>
                                </button>
                            ) : (
                                <button onClick={handleNext} className="px-6 py-3 rounded-lg font-bold bg-gray-800 hover:bg-gray-700 text-white flex items-center gap-2">
                                    {t.next} <i className="fas fa-arrow-right rtl:rotate-180"></i>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ResultView = ({ examSession, t, setView }) => {
            const res = examSession;
            const pct = Math.round((res.score / EXAM_LENGTH) * 100);
            return (
                <div className="max-w-2xl mx-auto glass-panel p-10 rounded-2xl shadow-2xl fade-in relative overflow-hidden border-t-8 border-t-gray-800">
                    <i className={`fas ${res.passed ? 'fa-award text-green-500/5' : 'fa-times-circle text-red-500/5'} absolute -bottom-20 -right-20 text-[250px] z-0`}></i>
                    
                    <div className="relative z-10">
                        <div className="text-center mb-10">
                            <div className={`inline-flex items-center justify-center w-24 h-24 rounded-full mb-6 shadow-2xl ${res.passed ? 'bg-green-900/30 text-green-500' : 'bg-red-900/30 text-ems-red'}`}>
                                <i className={`fas ${res.passed ? 'fa-check' : 'fa-times'} text-5xl`}></i>
                            </div>
                            <h2 className="text-3xl font-extrabold tracking-wide uppercase">{t.results}</h2>
                            <p className="text-gray-400 mt-2 font-mono">{res.examId}</p>
                        </div>

                        <div className="bg-[#0b1120] border border-gray-700 rounded-xl p-6 mb-8 relative shadow-inner">
                            <div className="absolute top-0 left-0 w-2 h-full bg-gray-700 rounded-l-xl"></div>
                            <div className="pl-6 rtl:pl-0 rtl:pr-6 space-y-4">
                                <div className="flex justify-between border-b border-gray-800 pb-3">
                                    <span className="text-gray-500 uppercase text-sm font-bold">{t.candidate}</span>
                                    <span className="text-white font-bold text-lg">{res.candidateName}</span>
                                </div>
                                <div className="flex justify-between border-b border-gray-800 pb-3">
                                    <span className="text-gray-500 uppercase text-sm font-bold">{t.requestedRank}</span>
                                    <span className="text-blue-400 font-bold">{res.requestedRank}</span>
                                </div>
                                <div className="flex justify-between items-center pt-2">
                                    <span className="text-gray-500 uppercase text-sm font-bold">{t.score}</span>
                                    <div className="text-right">
                                        <span className="text-3xl font-black text-white">{res.score}</span>
                                        <span className="text-gray-500 text-xl"> / {EXAM_LENGTH}</span>
                                        <div className="text-sm text-gray-500">{pct}% ({t.min_required}: {MIN_PASS_SCORE}/{EXAM_LENGTH})</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className={`p-5 rounded-xl text-center border font-bold text-lg mb-8 ${res.passed ? 'bg-green-900/20 border-green-500/30 text-green-400' : 'bg-red-900/20 border-red-500/30 text-red-400'}`}>
                            {res.passed ? t.pass_msg : t.fail_msg}
                        </div>

                        <button onClick={() => setView('home')} className="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-4 rounded-xl transition shadow-lg">
                            {t.return_home}
                        </button>
                    </div>
                </div>
            );
        };

        const AdminView = ({ history, db, setDb, t, language, setView }) => {
            const [search, setSearch] = useState('');
            const [viewDetails, setViewDetails] = useState(null);
            const [tab, setTab] = useState('history');

            const filteredHistory = history.filter(h => h.candidateName.toLowerCase().includes(search.toLowerCase()) || h.examId.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="max-w-6xl mx-auto glass-panel p-6 rounded-2xl shadow-2xl h-[85vh] flex flex-col fade-in">
                    <div className="flex justify-between items-center mb-6 pb-4 border-b border-gray-700">
                        <div className="flex items-center gap-4">
                            <h2 className="text-2xl font-bold"><i className="fas fa-shield-halved text-ems-red mr-3 rtl:ml-3"></i> {t.admin_dashboard}</h2>
                            <div className="flex bg-gray-800 p-1 rounded-lg">
                                <button onClick={() => setTab('history')} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition ${tab === 'history' ? 'bg-ems-red text-white' : 'text-gray-400'}`}>{t.history}</button>
                                <button onClick={() => setTab('bank')} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition ${tab === 'bank' ? 'bg-ems-red text-white' : 'text-gray-400'}`}>{t.question_bank_mgr}</button>
                            </div>
                        </div>
                        <button onClick={() => setView('home')} className="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold"><i className="fas fa-home"></i> Exit</button>
                    </div>

                    {tab === 'history' ? (
                        !viewDetails ? (
                            <div className="flex flex-col flex-grow overflow-hidden">
                                <input type="text" placeholder={t.search} value={search} onChange={e=>setSearch(e.target.value)} className="w-full bg-[#0b1120] border border-gray-700 rounded-lg p-4 text-white mb-6 focus:border-ems-red outline-none" />
                                
                                <div className="flex-grow overflow-auto border border-gray-700 rounded-xl bg-gray-900/30">
                                    <table className="w-full text-left rtl:text-right text-sm">
                                        <thead className="bg-gray-800 text-gray-400 sticky top-0">
                                            <tr>
                                                <th className="p-4">{t.date}</th>
                                                <th className="p-4">{t.candidate}</th>
                                                <th className="p-4">{t.requestedRank}</th>
                                                <th className="p-4">{t.score}</th>
                                                <th className="p-4">{t.status}</th>
                                                <th className="p-4 text-center">{t.actions}</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-800">
                                            {filteredHistory.length === 0 ? <tr><td colSpan="6" className="p-8 text-center text-gray-500">{t.no_data}</td></tr> : 
                                            filteredHistory.map((h, i) => (
                                                <tr key={i} className="hover:bg-gray-800/50 transition">
                                                    <td className="p-4 text-gray-400">{new Date(h.date).toLocaleDateString()}</td>
                                                    <td className="p-4 font-bold">{h.candidateName}</td>
                                                    <td className="p-4 text-blue-400">{h.requestedRank}</td>
                                                    <td className="p-4 font-mono">{h.score}/{EXAM_LENGTH}</td>
                                                    <td className="p-4"><span className={`px-2 py-1 rounded text-xs font-bold ${h.passed ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'}`}>{h.passed ? t.passed : t.failed}</span></td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => setViewDetails(h)} className="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-white text-xs font-bold transition"><i className="fas fa-eye"></i> View</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col flex-grow overflow-hidden fade-in">
                                <div className="flex justify-between items-center bg-gray-800 p-4 rounded-lg mb-4">
                                    <div><span className="text-gray-400 text-sm">Exam:</span> <span className="font-mono text-white">{viewDetails.examId}</span></div>
                                    <div><span className="text-gray-400 text-sm">{t.candidate}:</span> <span className="font-bold text-white">{viewDetails.candidateName}</span></div>
                                    <div><span className="text-gray-400 text-sm">{t.score}:</span> <span className={`font-bold ${viewDetails.passed ? 'text-green-400' : 'text-red-400'}`}>{viewDetails.score}/{EXAM_LENGTH}</span></div>
                                    <button onClick={() => setViewDetails(null)} className="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm"><i className="fas fa-arrow-left rtl:rotate-180"></i> Back</button>
                                </div>
                                
                                <div className="flex-grow overflow-auto space-y-6 pr-2">
                                    {viewDetails.questions.map((q, i) => {
                                        const isCorrect = q.candidateChoiceIdx === q.correctIdx;
                                        const qTxt = q.text[language] || q.text['en'];
                                        const optsArray = q.options[language] || q.options['en'];
                                        const candAns = q.candidateChoiceIdx !== -1 ? optsArray[q.candidateChoiceIdx] : t.not_answered;
                                        const corrAns = optsArray[q.correctIdx];
                                        
                                        return (
                                            <div key={i} className="bg-[#0b1120] border border-gray-700 p-6 rounded-xl">
                                                <div className="flex gap-4 mb-4">
                                                    <div className={`w-8 h-8 rounded flex items-center justify-center shrink-0 font-bold ${isCorrect ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'}`}>
                                                        {i + 1}
                                                    </div>
                                                    <p className="text-lg leading-relaxed">{qTxt}</p>
                                                </div>
                                                <div className="ml-12 rtl:mr-12 rtl:ml-0 space-y-3">
                                                    <div className={`p-4 rounded-lg border ${isCorrect ? 'bg-green-900/10 border-green-500/30' : 'bg-red-900/10 border-red-500/30'}`}>
                                                        <div className="text-xs text-gray-500 font-bold uppercase mb-1">{t.candidate_answer} {isCorrect && <i className="fas fa-check text-green-500 ml-2"></i>} {!isCorrect && <i className="fas fa-times text-red-500 ml-2"></i>}</div>
                                                        <div className={isCorrect ? 'text-green-300' : 'text-red-300'}>{candAns}</div>
                                                    </div>
                                                    {!isCorrect && (
                                                        <div className="p-4 rounded-lg border border-gray-700 bg-gray-800/50">
                                                            <div className="text-xs text-gray-500 font-bold uppercase mb-1">{t.correct_answer}</div>
                                                            <div className="text-gray-300">{corrAns}</div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )
                    ) : (
                        <div className="flex flex-col flex-grow overflow-hidden">
                            <div className="flex justify-between mb-4">
                                <span className="text-sm text-gray-400">Total Questions in Bank: {db.length}</span>
                            </div>
                            <div className="flex-grow overflow-auto border border-gray-700 rounded-xl bg-gray-900/30">
                                <table className="w-full text-left rtl:text-right text-sm">
                                    <thead className="bg-gray-800 text-gray-400 sticky top-0">
                                        <tr>
                                            <th className="p-4">ID</th>
                                            <th className="p-4">{t.rank}</th>
                                            <th className="p-4">{t.category}</th>
                                            <th className="p-4">{t.q_text}</th>
                                            <th className="p-4 text-center">Usage</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-800">
                                        {db.map((q, i) => (
                                            <tr key={i} className="hover:bg-gray-800/50 transition">
                                                <td className="p-4 font-mono text-xs text-ems-red font-bold">{q.id}</td>
                                                <td className="p-4 text-blue-400">{q.rank}</td>
                                                <td className="p-4 text-gray-400">{q.category}</td>
                                                <td className="p-4 truncate max-w-md">{q.text.en}</td>
                                                <td className="p-4 text-center font-mono">{q.usageCount}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminLoginModal = ({ onLogin, onClose, t }) => {
            const [pass, setPass] = useState('');
            const [error, setError] = useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pass === '0112') {
                    onLogin();
                } else {
                    setError(true);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm fade-in">
                    <div className="glass-panel p-8 rounded-2xl w-full max-w-md relative shadow-2xl border border-gray-700">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-white"><i className="fas fa-times"></i></button>
                        <div className="text-center mb-6">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-ems-red/20 text-ems-red mb-4">
                                <i className="fas fa-lock text-2xl"></i>
                            </div>
                            <h3 className="text-2xl font-bold">{t.admin_pass_title}</h3>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-300 mb-2">{t.admin_pass_prompt}</label>
                                <input autoFocus type="password" value={pass} onChange={e => { setPass(e.target.value); setError(false); }} className="w-full bg-[#0b1120] border border-gray-700 rounded-lg p-3.5 text-white outline-none focus:border-ems-red font-mono text-center text-xl tracking-widest" placeholder="••••" />
                            </div>
                            {error && <div className="text-ems-red text-sm text-center font-semibold">{t.admin_pass_err}</div>}
                            <button type="submit" className="w-full bg-ems-red hover:bg-red-700 text-white font-bold py-3.5 rounded-lg transition shadow-lg">
                                {t.admin_pass_btn}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home'); 
            const [language, setLanguage] = useState('en');
            const [candidate, setCandidate] = useState(null);
            const [examSession, setExamSession] = useState(null);
            const [history, setHistory] = useState([]);
            const [db, setDb] = useState(initialQuestionsDB);
            const [showAdminLogin, setShowAdminLogin] = useState(false);

            const t = i18n[language] || i18n['en'];

            useEffect(() => {
                document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.className = language === 'ar' 
                    ? 'rtl min-h-screen text-ems-light selection:bg-ems-red selection:text-white' 
                    : 'min-h-screen text-ems-light selection:bg-ems-red selection:text-white';
            }, [language]);

            const startExam = (formData) => {
                const rankQs = db.filter(q => q.rank === formData.requestedRank && q.active);
                
                const candidateHistory = history.filter(h => h.candidateName.toLowerCase() === formData.fullName.toLowerCase());
                const seenIds = new Set();
                candidateHistory.forEach(h => h.questions.forEach(q => seenIds.add(q.id)));

                let sortedQs = [...rankQs].sort((a, b) => {
                    const aSeen = seenIds.has(a.id);
                    const bSeen = seenIds.has(b.id);
                    if (aSeen && !bSeen) return 1;
                    if (!aSeen && bSeen) return -1;
                    return a.usageCount - b.usageCount;
                });

                let selected = sortedQs.slice(0, EXAM_LENGTH);
                selected = selected.sort(() => Math.random() - 0.5);

                selected = selected.map(q => {
                    const indices = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
                    const newCorrectIndex = indices.indexOf(q.correctAnswer);
                    return { ...q, shuffledIndices: indices, mappedCorrectIndex: newCorrectIndex };
                });

                setCandidate(formData);
                setExamSession({
                    questions: selected,
                    answers: {}, 
                    startTime: new Date()
                });
                setView('exam');
            };

            const submitExam = useCallback((answersMap) => {
                let score = 0;
                const examDetails = examSession.questions.map((q, index) => {
                    const chosenMappedIdx = answersMap[index];
                    const chosenOriginalIdx = chosenMappedIdx !== undefined ? q.shuffledIndices[chosenMappedIdx] : -1;
                    
                    if (chosenOriginalIdx === q.correctAnswer) score++;

                    return {
                        id: q.id,
                        text: q.text,
                        options: q.options,
                        candidateChoiceIdx: chosenOriginalIdx,
                        correctIdx: q.correctAnswer
                    };
                });

                const resultRecord = {
                    examId: `EMS-${Math.floor(100000 + Math.random() * 900000)}`,
                    candidateName: candidate.fullName,
                    currentRank: candidate.currentRank,
                    requestedRank: candidate.requestedRank,
                    score: score,
                    passed: score >= MIN_PASS_SCORE,
                    date: new Date().toISOString(),
                    questions: examDetails
                };

                setDb(prevDb => prevDb.map(q => {
                    if (examDetails.some(ed => ed.id === q.id)) return { ...q, usageCount: q.usageCount + 1 };
                    return q;
                }));

                setHistory(prev => [resultRecord, ...prev]);
                setExamSession(resultRecord); 
                setView('result');
            }, [examSession, candidate]);

            return (
                <div className="flex flex-col min-h-screen relative">
                    <div className="fixed inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1587559070757-f72a388edbba?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center">
                        <div className="absolute inset-0 bg-[#0b1120]/90 backdrop-blur-sm"></div>
                    </div>

                    <div className="relative z-10 flex flex-col min-h-screen">
                        <header className="border-b border-gray-800 bg-[#0b1120]/80 sticky top-0 z-50">
                            <div className="container mx-auto px-6 py-4 flex justify-between items-center">
                                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                                    <div className="w-12 h-12 bg-ems-red rounded-lg flex items-center justify-center shadow-lg shadow-red-900/30">
                                        <i className="fas fa-star-of-life text-white text-2xl pulse-red"></i>
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-xl tracking-wide">{t.title}</h1>
                                        <p className="text-xs text-gray-400 tracking-widest">{t.subtitle}</p>
                                    </div>
                                </div>
                                <div className="flex bg-gray-800/80 p-1 rounded-lg border border-gray-700">
                                    {['ar', 'fr', 'en'].map(l => (
                                        <button key={l} onClick={() => setLanguage(l)} className={`px-3 py-1.5 text-xs font-bold rounded transition ${language === l ? 'bg-ems-red text-white' : 'text-gray-400 hover:text-white'}`}>
                                            {l.toUpperCase()}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </header>

                        <main className="flex-grow container mx-auto px-4 py-10">
                            {view === 'home' && (
                                <div className="flex flex-col items-center justify-center h-full min-h-[60vh] fade-in">
                                    <i className="fas fa-file-medical text-ems-red text-7xl mb-8 opacity-90 drop-shadow-[0_0_15px_rgba(220,38,38,0.5)]"></i>
                                    <h2 className="text-4xl md:text-5xl font-extrabold mb-4 text-center tracking-tight">Official Promotion Portal</h2>
                                    
                                    <div className="flex flex-wrap justify-center gap-6 w-full max-w-2xl mt-12">
                                        <button onClick={() => setView('form')} className="flex-1 min-w-[200px] bg-ems-red hover:bg-red-700 text-white font-bold py-5 px-6 rounded-xl transition-all shadow-[0_10px_20px_-10px_rgba(220,38,38,0.6)] flex flex-col items-center gap-3">
                                            <i className="fas fa-user-md text-3xl"></i>
                                            <span className="text-lg">{t.candidate_portal}</span>
                                        </button>
                                        <button onClick={() => setShowAdminLogin(true)} className="flex-1 min-w-[200px] bg-gray-800 hover:bg-gray-700 text-white font-bold py-5 px-6 rounded-xl transition-all flex flex-col items-center gap-3">
                                            <i className="fas fa-shield-halved text-3xl text-gray-400"></i>
                                            <span className="text-lg">{t.admin}</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {view === 'form' && (
                                <div className="max-w-md mx-auto glass-panel p-8 rounded-2xl shadow-2xl fade-in mt-10">
                                    <div className="flex justify-between items-center mb-8 border-b border-gray-700/50 pb-4">
                                        <h2 className="text-2xl font-bold"><i className="fas fa-clipboard-list text-ems-red mr-2 rtl:ml-2"></i> {t.candidate_portal}</h2>
                                        <button onClick={() => setView('home')} className="text-gray-400 hover:text-white"><i className="fas fa-times"></i></button>
                                    </div>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const fd = new FormData(e.target);
                                        const data = {
                                            fullName: fd.get('fullName'),
                                            currentRank: fd.get('currentRank'),
                                            requestedRank: fd.get('requestedRank')
                                        };
                                        const currIdx = RANKS.indexOf(data.currentRank);
                                        const reqIdx = RANKS.indexOf(data.requestedRank);
                                        if (reqIdx !== currIdx + 1) return alert(t.invalid_promotion);
                                        startExam(data);
                                    }} className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-300 mb-2">{t.fullName}</label>
                                            <input required name="fullName" type="text" className="w-full bg-[#0b1120] border border-gray-700 rounded-lg p-3.5 text-white outline-none focus:border-ems-red" placeholder="e.g. John Doe" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-300 mb-2">{t.currentRank}</label>
                                            <select name="currentRank" className="w-full bg-[#0b1120] border border-gray-700 rounded-lg p-3.5 text-white outline-none focus:border-ems-red">
                                                {RANKS.slice(0, -1).map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-300 mb-2">{t.requestedRank}</label>
                                            <select name="requestedRank" className="w-full bg-[#0b1120] border border-gray-700 rounded-lg p-3.5 text-white outline-none focus:border-ems-red">
                                                {RANKS.slice(1).map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                        </div>
                                        <button type="submit" className="w-full bg-ems-red hover:bg-red-700 text-white font-bold py-4 rounded-lg flex justify-center items-center gap-2 mt-4">
                                            {t.begin} <i className="fas fa-arrow-right rtl:rotate-180"></i>
                                        </button>
                                    </form>
                                </div>
                            )}

                            {view === 'exam' && <ExamView candidate={candidate} examSession={examSession} submitExam={submitExam} t={t} language={language} />}
                            {view === 'result' && <ResultView examSession={examSession} t={t} setView={setView} />}
                            {view === 'admin' && <AdminView history={history} db={db} setDb={setDb} t={t} language={language} setView={setView} />}

                            {showAdminLogin && (
                                <AdminLoginModal 
                                    onLogin={() => { setShowAdminLogin(false); setView('admin'); }} 
                                    onClose={() => setShowAdminLogin(false)} 
                                    t={t} 
                                />
                            )}

                        </main>
                        <footer className="border-t border-gray-800 py-6 text-center text-gray-600 text-xs font-medium uppercase tracking-widest bg-[#0b1120]/80">
                            &copy; {new Date().getFullYear()} 43 FAMILY ROLEPLAY &bull; EMS DEPARTMENT SEASON 2
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
